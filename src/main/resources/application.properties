spring.datasource.url=jdbc:postgresql://localhost:5436/cmygehm_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.default_schema=homework_5

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.flyway.url=jdbc:postgresql://localhost:5436/cmygehm_db
spring.flyway.user=postgres
spring.flyway.password=postgres
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=homework_5
spring.flyway.baseline-on-migrate=true

logging.level.org.flywaydb=DEBUG